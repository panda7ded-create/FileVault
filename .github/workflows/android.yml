name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Pre-build Check
        run: |
          echo "=== SDK Check ==="
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/
          echo ""
          echo "=== Project Structure ==="
          find . -name "build.gradle*" -type f
          ls -la app/src/main/

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --info

      - name: Debug Build Output
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== APK Directory ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload via GitHub API
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK found, uploading..."
            ls -la app/build/outputs/apk/debug/app-debug.apk
            # Upload artifact via GitHub API
            response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/panda7ded-create/FileVault/actions/artifacts?filename=app-debug.apk&content_type=application%2Fvnd.android.package-archive" \
              --data-binary @app/build/outputs/apk/debug/app-debug.apk)
            echo "$response"
          else
            echo "APK not found!"
            find . -name "*.apk" -type f 2>/dev/null
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir not found"
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error