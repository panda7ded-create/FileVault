name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: List build outputs
        run: |
          echo "=== Build directory ==="
          ls -la app/build/outputs/
          ls -la app/build/outputs/apk/
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        run: |
          cd app/build/outputs/apk/debug/
          ls -la
          if [ -f app-debug.apk ]; then
            echo "Uploading app-debug.apk..."
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/panda7ded-create/FileVault/actions/artifacts?filename=app-debug.apk&content_type=application%2Fvnd.android.package-archive" \
              --data-binary @app-debug.apk
          fi
