name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon 2>&1

      - name: Debug Output
        if: always()
        run: |
          echo "=== Build output ==="
          find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -laR app/build/outputs 2>/dev/null || echo "No outputs"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/
          retention-days: 7
