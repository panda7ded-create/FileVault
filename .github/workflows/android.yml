name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Pre-build Check
        run: |
          echo "=== SDK Check ==="
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/
          echo ""
          echo "=== Project Structure ==="
          find . -name "build.gradle*" -type f
          ls -la app/src/main/

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee build_output.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Debug Build Output
        if: always()
        run: |
          echo "=== Build Exit Code ==="
          echo $EXIT_CODE
          echo ""
          echo "=== Build Output Log (last 300 lines) ==="
          tail -300 build_output.log
          echo ""
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== APK Directory ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"
          echo ""
          echo "=== app/build directory ==="
          ls -la app/build/ 2>/dev/null || echo "No build directory"

      - name: Upload Artifact
        if: success() && fileExists('app/build/outputs/apk/debug/app-debug.apk')
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7