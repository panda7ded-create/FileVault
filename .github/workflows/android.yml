name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Display environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"

      - name: Build with debug output
        run: |
          chmod +x ./gradlew
          cat settings.gradle.kts
          cat app/build.gradle.kts
          echo ""
          echo "=== Starting build ==="
          ./gradlew tasks --no-daemon 2>&1 | head -50
          echo ""
          echo "=== Building ==="
          ./gradlew assembleDebug --no-daemon --debug 2>&1 | tail -100

      - name: Find APK
        run: |
          echo "=== All files in project ==="
          find . -type f -name "*.apk" 2>/dev/null
          echo ""
          echo "=== Build directory ==="
          ls -laR app/build/ 2>/dev/null | head -100

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: FileVault-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
        if: success()
