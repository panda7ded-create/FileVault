name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Debug Info
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo ""
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo ""
          echo "=== SDK platforms ==="
          ls -la $ANDROID_HOME/platforms 2>/dev/null || echo "No platforms"
          echo ""
          echo "=== SDK build-tools ==="
          ls -la $ANDROID_HOME/build-tools 2>/dev/null || echo "No build-tools"
          echo ""
          echo "=== Cached Gradle ==="
          ls -la ~/.gradle/caches 2>/dev/null | head -10

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v1-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileVault-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
