name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Check Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --no-daemon 2>&1 | grep -i "assemble\|build\|install"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Find APK
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== Build outputs ==="
          ls -laR app/build/outputs/ 2>/dev/null | head -50
          echo ""
          echo "=== APK file check ==="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            ls -la app/build/outputs/apk/debug/app-debug.apk
            echo "APK FOUND!"
          else
            echo "APK NOT FOUND!"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: FileVault-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
