name: Debug Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Debug Info
        run: |
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Javac ==="
          javac -version
          echo ""
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo ""
          echo "=== SDK contents ==="
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not accessible"
          echo ""
          echo "=== SDK platforms ==="
          ls -la $ANDROID_HOME/platforms 2>/dev/null || echo "No platforms"
          echo ""
          echo "=== SDK build-tools ==="
          ls -la $ANDROID_HOME/build-tools 2>/dev/null || echo "No build-tools"
          
      - name: Check Gradle Files
        run: |
          echo "=== Gradle Version ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== App Build File ==="
          head -30 app/build.gradle.kts
          
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          echo ""
          echo "=== BEFORE BUILD ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK dir before build"
          echo ""
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -150
          echo ""
          echo "=== AFTER BUILD ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK dir after build"

      - name: Check APK exists
        run: |
          echo "=== Checking APK ==="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK FOUND! Size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
          else
            echo "APK NOT FOUND!"
            find app/build -type f 2>/dev/null | head -20
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileVault-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
