name: Debug Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Debug Info
        run: |
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Javac ==="
          javac -version
          echo ""
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo ""
          echo "=== SDK platforms ==="
          ls -la $ANDROID_HOME/platforms 2>/dev/null || echo "No platforms"
          echo ""
          echo "=== SDK build-tools ==="
          ls -la $ANDROID_HOME/build-tools 2>/dev/null || echo "No build-tools"
          
      - name: Check Gradle Files
        run: |
          echo "=== Gradle Version ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== App Build File ==="
          cat app/build.gradle.kts
          
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          echo ""
          ./gradlew clean assembleDebug --no-daemon 2>&1

      - name: Find APK
        run: |
          echo "=== Finding APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== Build outputs directory ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileVault-debug.apk
          path: app/build/outputs/apk/debug/
          retention-days: 7
